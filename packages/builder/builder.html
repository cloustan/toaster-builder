<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toaster Course Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    <style>
        html, body { min-height: 100vh; }
        body { color: #1e293b; }
        .title-tiny5 { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
        .glass-card {
          background: rgba(255, 255, 255, 0.4);
          backdrop-filter: blur(5px);
          -webkit-backdrop-filter: blur(5px);
          border-radius: 18px;
          border: 1px solid rgba(255, 255, 255, 0.3);
          box-shadow:
            0 8px 32px rgba(0, 0, 0, 0.1),
            inset 0 1px 0 rgba(255, 255, 255, 0.5),
            inset 0 -1px 0 rgba(255, 255, 255, 0.1),
            inset 0 0 60px 30px rgba(255, 255, 255, 0.3);
          position: relative;
          overflow: hidden;
        }
        .glass-card::before {
          content: '';
          position: absolute;
          top: 0; left: 0; right: 0; height: 1px;
          background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
        }
        .glass-card::after {
          content: '';
          position: absolute;
          top: 0; left: 0; width: 1px; height: 100%;
          background: linear-gradient(180deg, rgba(255, 255, 255, 0.8), transparent, rgba(255, 255, 255, 0.3));
        }
        .step-card { transition: border-color 0.2s ease, box-shadow 0.2s ease; }
        .step-card:hover { box-shadow: 0 10px 40px rgba(0,0,0,0.12); }
        .notched-input { border-bottom: 2px solid #cbd5e1; transition: border-color 0.2s; }
        .notched-input:focus { border-color: #94a3b8; outline: none; }
        .img-preview { max-height: 150px; width: auto; object-fit: contain; border-radius: 0.5rem; display: none; border: 1px solid #e2e8f0; }
        .kbd-hint { font-size: 0.65rem; padding: 1px 4px; background: #e2e8f0; border-radius: 4px; color: #64748b; margin-left: 4px; }
        #json-output { word-break: break-all; white-space: pre-wrap; }
    </style>
    <!-- Toaster skin overrides: shared tokens and solid background -->
    <style>
      :root{
        --app-bg:#0055ff;
        --text:#e5e7eb;
        --muted:#9ca3af;
        --card-bg: rgba(13, 54, 180, 0.32);
        --card-border: rgba(255,255,255,0.15);
        --card-shadow: 0 10px 30px rgba(0,0,0,0.25);
        --accent-color:#8b5cf6;
        /* back-compat aliases */
        --card: var(--card-bg);
        --border: var(--card-border);
      }
      .toaster-skin, .toaster-skin * { box-sizing: border-box; }
      .toaster-skin { background: var(--app-bg) !important; background-image:none !important; color:var(--text); }
      .toaster-skin .glass-card { background: var(--card-bg); border:1px solid var(--card-border); border-radius:18px; box-shadow: var(--card-shadow); backdrop-filter: blur(18px) saturate(120%); -webkit-backdrop-filter: blur(18px) saturate(120%); }
      .toaster-skin .card { background: var(--card-bg); border:1px solid var(--card-border); border-radius:18px; box-shadow: var(--card-shadow); backdrop-filter: blur(18px) saturate(120%); -webkit-backdrop-filter: blur(18px) saturate(120%); }
      .toaster-skin .border-slate-200 { border-color: var(--card-border) !important; }
      .toaster-skin .bg-white { background: rgba(255,255,255,0.06) !important; color: var(--text) !important; border:1px solid var(--card-border) !important; }
      .toaster-skin .bg-slate-50 { background: rgba(255,255,255,0.06) !important; color: var(--text) !important; }
      .toaster-skin .bg-slate-100 { background: rgba(255,255,255,0.12) !important; color: var(--text) !important; }
      .toaster-skin .bg-slate-800, .toaster-skin .bg-slate-900 { background: var(--accent-color) !important; color:#0b1020 !important; border-color: transparent !important; }
      .toaster-skin .text-slate-900, .toaster-skin .text-slate-800, .toaster-skin .text-slate-700 { color: var(--text) !important; }
      .toaster-skin .text-slate-600, .toaster-skin .text-slate-500, .toaster-skin .text-slate-400 { color: var(--muted) !important; }
      .toaster-skin .notched-input, .toaster-skin select, .toaster-skin textarea { width:100%; max-width:100%; background: rgba(255,255,255,0.06); border:1px solid var(--card-border); color:var(--text); border-radius:18px; padding:10px 12px; }
      .toaster-skin .notched-input:focus, .toaster-skin select:focus, .toaster-skin textarea:focus { outline:none; border-color: rgba(255,255,255,0.35); }
      /* Step number badge: improve contrast */
      .toaster-skin .step-number { background: rgba(255,255,255,0.85) !important; color:#0b1020 !important; border:1px solid var(--card-border); box-shadow: var(--card-shadow); }
      /* Top header actions: force white buttons with dark text */
      .toaster-skin header .flex.gap-2 > * { background:#ffffff !important; color:#0b1020 !important; border:1px solid var(--card-border) !important; border-radius:18px !important; box-shadow: var(--card-shadow); }
      .toaster-skin header .flex.gap-2 > *:hover { background:#f5f5f5 !important; }
      /* Standardize rounded utilities to 18px to match dashboard */
      .toaster-skin .rounded-lg, .toaster-skin .rounded-xl { border-radius: 18px !important; }
      @media(max-width:768px){ .toaster-skin .glass-card{ backdrop-filter:none; -webkit-backdrop-filter:none; } }
      /* Subtle entrance animation */
      @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .toaster-skin .glass-card { animation: fadeUp .6s ease both; }
      @media (prefers-reduced-motion: reduce) { .toaster-skin .glass-card { animation: none; } }
    </style>
</head>
<body class="toaster-skin p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="title-tiny5 text-3xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
                    Toaster Course Builder
                </h1>
                <p class="text-slate-500">Create and share course files.</p>
            </div>
            <div class="flex gap-2">
                <label class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-medium transition-colors border border-slate-200 flex items-center">
                    Import <span class="kbd-hint hidden sm:inline">Ctrl+I</span>
                    <input type="file" id="import-input" accept=".toaster,.json" class="hidden" onchange="importFile(this)">
                </label>
                <button onclick="downloadCourseFile()" class="bg-slate-800 hover:bg-slate-700 text-white px-6 py-2 rounded-lg font-medium shadow-sm transition-colors flex items-center">
                    Download <span class="kbd-hint bg-slate-700 text-white border-none hidden sm:inline">Ctrl+S</span>
                </button>
                <button onclick="publishCourse()" class="bg-slate-600 hover:bg-slate-500 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-colors flex items-center">
                    Publish
                </button>
                <button onclick="resetBuilder()" class="bg-white border border-slate-200 hover:bg-slate-50 px-4 py-2 rounded-lg font-medium transition-colors text-red-600">
                    Reset
                </button>
            </div>
        </header>

        <!-- Metadata -->
        <div class="glass-card p-6 mb-8">
            <h2 class="text-lg font-semibold mb-4 border-b pb-2 flex justify-between items-center">
                Course Metadata
                <span id="save-status" class="text-xs font-normal text-slate-400">Autosave: Idle</span>
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Course Title</label>
                    <input type="text" id="course-title" placeholder="e.g., Beginners Method" class="w-full notched-input py-2" oninput="handleInput()">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Author</label>
                    <input type="text" id="author" placeholder="e.g., @your-handle" class="w-full notched-input py-2" oninput="handleInput()">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Cube Type</label>
                    <select id="cube-type" class="w-full notched-input py-2 bg-transparent" onchange="handleInput()">
                        <option value="3x3">3x3 Rubik's Cube</option>
                        <option value="2x2">2x2 Pocket Cube</option>
                        <option value="4x4">4x4 Revenge</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Difficulty</label>
                    <select id="difficulty" class="w-full notched-input py-2 bg-transparent" onchange="handleInput()">
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="steps-container" class="space-y-4 mb-8"></div>

        <button onclick="addStep()" class="w-full py-4 border-2 border-dashed border-slate-300 rounded-xl text-slate-500 hover:border-slate-400 hover:text-slate-600 transition-all font-medium flex items-center justify-center gap-2 bg-white mb-20">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
            Add Blank Step <span class="kbd-hint">Ctrl+Enter</span>
        </button>

        
    </div>

    <!-- Step Template -->
    <template id="step-template">
        <div class="step-card glass-card p-6 relative group">
            <div class="absolute -left-12 top-0 bottom-0 flex flex-col justify-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity hidden md:flex">
                <button onclick="moveStep(this, -1)" class="p-1 hover:bg-slate-100 rounded text-slate-400 hover:text-slate-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" /></svg>
                </button>
                <button onclick="moveStep(this, 1)" class="p-1 hover:bg-slate-100 rounded text-slate-400 hover:text-slate-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                </button>
            </div>
            <button class="remove-btn absolute top-4 right-4 text-slate-300 hover:text-red-500 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
            </button>
            <div class="flex items-center gap-3 mb-4">
                <span class="step-number bg-slate-100 text-slate-700 w-8 h-8 rounded-full flex items-center justify-center font-bold">1</span>
                <input type="text" placeholder="Step Title" class="step-title w-full text-lg font-semibold notched-input py-1" oninput="handleInput()">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Description</label>
                    <textarea placeholder="Instructions..." class="step-desc w-full h-32 p-2 border border-slate-200 rounded-lg text-sm focus:border-slate-500 outline-none resize-none" oninput="handleInput()"></textarea>
                </div>
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Illustrations (Multiple)</label>
                    <div class="relative border-2 border-dashed border-slate-200 rounded-lg p-2 text-center bg-slate-50 hover:bg-slate-100 min-h-32 flex flex-col items-center justify-center overflow-hidden">
                        <input type="file" accept="image/*" multiple class="step-img-input absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="handleImageUpload(this)">
                        <div class="upload-placeholder text-slate-400">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mx-auto mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                            <div class="text-xs">Click to add images (up to 30)</div>
                        </div>
                        <div class="images-list grid grid-cols-3 gap-2 w-full mt-2"></div>
                        <button type="button" onclick="undoLastImage(this)" class="images-undo mt-2 hidden text-xs text-slate-600 underline">Undo remove</button>
                    </div>
                </div>
                <div class="md:col-span-1 space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Algorithm</label>
                        <input type="text" placeholder="R U R' U'" class="step-algo w-full p-2 bg-slate-50 border border-slate-200 rounded-lg font-mono text-sm uppercase" oninput="handleInput()">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Goal</label>
                        <select class="step-goal w-full p-2 border border-slate-200 rounded-lg text-sm bg-white" onchange="handleInput()">
                            <option value="scrambled">Scrambled</option>
                            <option value="top_cross">Top Cross</option>
                            <option value="first_layer">First Layer</option>
                            <option value="oll">OLL</option>
                            <option value="pll">PLL</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script>
        const WORKER_URL = "https://toaster-bulider-worker.choits824.workers.dev/"; // generic publish endpoint
        
        let stepCount = 0;
        let autoSaveTimer;

        // Plain JSON download (no encryption)
        function downloadCourseFile() {
            const data = getCourseData();
            if (!data.format) data.format = 'toaster@1';
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${(data.title || 'course').toLowerCase().replace(/\s+/g, '_')}.toaster`;
            a.click();
        }

        // --- CORE FUNCTIONS ---
        function getCourseData() {
            const steps = [];
            document.querySelectorAll('.step-card').forEach((card, i) => {
                const images = card.dataset.images ? JSON.parse(card.dataset.images) : [];
                const visualAid = card.dataset.imageBase64 || null;
                steps.push({
                    order: i + 1,
                    title: card.querySelector('.step-title').value,
                    description: card.querySelector('.step-desc').value,
                    visual_aid: visualAid,
                    images: images.map(src => ({ src, alt: '' })),
                    videos: [],
                    algorithm: card.querySelector('.step-algo').value.toUpperCase().split(' ').filter(m => m.trim()),
                    target_state: card.querySelector('.step-goal').value
                });
            });

            return {
                title: document.getElementById('course-title').value,
                author: document.getElementById('author').value,
                cube_type: document.getElementById('cube-type').value,
                difficulty: document.getElementById('difficulty').value,
                last_saved: new Date().toISOString(),
                steps
            };
        }

        

        // --- AUTOSAVE LOGIC ---
        function handleInput() {
            const status = document.getElementById('save-status');
            status.innerText = "Typing...";
            status.classList.add('text-slate-500');

            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                const data = getCourseData();
                localStorage.setItem('toaster_builder_draft', JSON.stringify(data));
                status.innerText = "Draft Saved: " + new Date().toLocaleTimeString();
                status.classList.remove('text-slate-500');
            }, 800);
        }

        function loadDraft() {
            const saved = localStorage.getItem('toaster_builder_draft');
            if (saved) {
                const data = JSON.parse(saved);
                renderBuilder(data);
                document.getElementById('save-status').innerText = "Restored draft from session";
            } else {
                addStep();
            }
        }

        function renderBuilder(data) {
            document.getElementById('course-title').value = data.title || '';
            document.getElementById('author').value = data.author || '';
            document.getElementById('cube-type').value = data.cube_type || '3x3';
            document.getElementById('difficulty').value = data.difficulty || 'Beginner';
            document.getElementById('steps-container').innerHTML = '';
            stepCount = 0;
            if (data.steps && data.steps.length > 0) {
                data.steps.forEach(s => addStep(s));
            } else {
                addStep();
            }
        }

        // --- UI HELPERS ---
        function addStep(data = null) {
            stepCount++;
            const container = document.getElementById('steps-container');
            const template = document.getElementById('step-template');
            const clone = template.content.cloneNode(true);
            const card = clone.querySelector('.step-card');
            
            card.querySelector('.step-number').innerText = stepCount;
            if (data) {
                card.querySelector('.step-title').value = data.title || '';
                card.querySelector('.step-desc').value = data.description || '';
                card.querySelector('.step-algo').value = (data.algorithm || []).join(' ');
                card.querySelector('.step-goal').value = data.target_state || 'scrambled';
                const imgs = Array.isArray(data.images) ? data.images.map(i => i.src).filter(Boolean) : [];
                if (imgs.length) {
                    const list = card.querySelector('.images-list');
                    imgs.forEach((src) => addImageThumb(card, src));
                    card.dataset.images = JSON.stringify(imgs);
                    card.querySelector('.upload-placeholder').style.display = 'none';
                } else if (data.visual_aid) {
                    // Backward compatibility: single visual_aid
                    addImageThumb(card, data.visual_aid);
                    card.dataset.imageBase64 = data.visual_aid;
                    card.dataset.images = JSON.stringify([data.visual_aid]);
                    card.querySelector('.upload-placeholder').style.display = 'none';
                }
                // videos removed from UI and export
            }
            card.querySelector('.remove-btn').onclick = () => { card.remove(); reorder(); handleInput(); };
            container.appendChild(clone);
        }

        function reorder() {
            stepCount = 0;
            document.querySelectorAll('.step-card').forEach(step => {
                stepCount++;
                step.querySelector('.step-number').innerText = stepCount;
            });
        }

        function moveStep(btn, dir) {
            const card = btn.closest('.step-card');
            if (dir === -1 && card.previousElementSibling) card.parentNode.insertBefore(card, card.previousElementSibling);
            else if (dir === 1 && card.nextElementSibling) card.parentNode.insertBefore(card.nextElementSibling, card);
            reorder();
            handleInput();
        }

        function handleImageUpload(input) {
            const files = Array.from(input.files || []);
            const card = input.closest('.step-card');
            if (!files.length || !card) return;
            const list = card.querySelector('.images-list');
            const existing = card.dataset.images ? JSON.parse(card.dataset.images) : [];
            const limit = 30 - existing.length;
            const toRead = files.slice(0, Math.max(0, limit));
            let completed = 0;
            toRead.forEach((file) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const src = e.target.result;
                    existing.push(src);
                    addImageThumb(card, src);
                    completed++;
                    if (completed === toRead.length) {
                        card.dataset.images = JSON.stringify(existing);
                        card.querySelector('.upload-placeholder').style.display = 'none';
                        // keep legacy single as first image
                        if (!card.dataset.imageBase64 && existing.length) {
                            card.dataset.imageBase64 = existing[0];
                        }
                        handleInput();
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        // --- IMAGE LIST HELPERS ---
        function addImageThumb(card, src) {
            const list = card.querySelector('.images-list');
            const idx = (card.dataset.images ? JSON.parse(card.dataset.images) : []).indexOf(src);
            const wrapper = document.createElement('div');
            wrapper.className = 'relative';
            const img = document.createElement('img');
            img.src = src;
            img.className = 'img-preview w-full h-auto';
            img.style.display = 'block';
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'absolute top-1 right-1 bg-white/80 hover:bg-white text-red-600 border border-slate-200 rounded px-1 text-xs';
            btn.textContent = '×';
            btn.onclick = () => removeImage(wrapper.closest('.step-card'), src);
            wrapper.appendChild(img);
            wrapper.appendChild(btn);
            list.appendChild(wrapper);
        }

        function removeImage(card, src) {
            if (!card) return;
            const arr = card.dataset.images ? JSON.parse(card.dataset.images) : [];
            const idx = arr.indexOf(src);
            if (idx >= 0) {
                arr.splice(idx, 1);
                card.dataset.images = JSON.stringify(arr);
                // store last removed for undo
                card.dataset.lastRemovedImage = src;
                // remove from DOM
                const list = card.querySelector('.images-list');
                const nodes = Array.from(list.querySelectorAll('img'));
                const node = nodes.find(n => n.src === src);
                if (node) list.removeChild(node.parentElement);
                const undoBtn = card.querySelector('.images-undo');
                if (undoBtn) undoBtn.classList.remove('hidden');
                handleInput();
            }
        }

        function undoLastImage(btn) {
            const card = btn.closest('.step-card');
            if (!card || !card.dataset.lastRemovedImage) return;
            const src = card.dataset.lastRemovedImage;
            const arr = card.dataset.images ? JSON.parse(card.dataset.images) : [];
            if (!arr.includes(src)) {
                arr.push(src);
                card.dataset.images = JSON.stringify(arr);
                addImageThumb(card, src);
                // keep legacy single as first image if it was removed
                if (!card.dataset.imageBase64) card.dataset.imageBase64 = src;
            }
            delete card.dataset.lastRemovedImage;
            btn.classList.add('hidden');
            handleInput();
        }

        

        function importFile(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const content = e.target.result;
                const data = JSON.parse(content);
                if (data) { renderBuilder(data); handleInput(); }
            };
            reader.readAsText(file);
        }

        function resetBuilder() {
            if(confirm("Clear everything?")) {
                localStorage.removeItem('toaster_builder_draft');
                location.reload();
            }
        }

        

        window.onload = loadDraft;

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); addStep(); }
            if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); downloadCourseFile(); }
        });
    </script>
</body>
</html>
