name: Deploy Builder (frontend)

on:
  push:
    branches: [ frontend ]
    paths:
      - 'packages/builder/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Show Node/NPM
        run: |
          node --version
          npm --version
          npx --version

      - name: Install dependencies
        run: npm ci
        working-directory: packages/builder

      - name: Build
        run: npm run build
        working-directory: packages/builder

      - name: Inspect build output (debug)
        run: |
          echo "Listing package dir:"
          ls -la packages/builder
          echo "Listing build output:"
          ls -la packages/builder/dist || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: toaster-builder
          # <- set this to the final output folder from your build
          directory: packages/builder/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
